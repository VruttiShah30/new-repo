<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <title>Smart Grocery List</title>

  <!-- ==============================Bootstrap ============================= -->
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/css/bootstrap.min.css" rel="stylesheet">

  <!-- =================================Font Awesome====================================== -->
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.0/css/all.min.css">

  <style>
    body {
      background: linear-gradient(135deg, #74ebd5, #ACB6E5);
      min-height: 100vh;
    }

    .card {
      border-radius: 15px;
      animation: fadeIn 0.6s ease-in-out;
    }

    .list-group-item {
      transition: all 0.3s ease;
    }

    .list-group-item:hover {
      transform: scale(1.02);
      background-color: #f8f9fa;
    }

    .btn:hover {
      transform: scale(1.1);
    }

  </style>
</head>

<body>

<div class="container mt-5">
  <div class="card shadow p-4 mx-auto" style="max-width: 500px;">
    
    <h3 class="text-center mb-3"> Grocery List App</h3>

    <!-- ================================Add Form====================================== -->
    <form id="groceryForm" class="d-flex gap-2 mb-3">
        <input type="text" id="name" class="form-control" placeholder="Item name" required>
        <input type="number" id="qty" class="form-control" placeholder="Qty" required>
        <button class="btn btn-success">
            <i class="fa fa-plus"></i>
        </button>
    </form>

    <!-- ======================================= Search Bar ======================================= -->
    <div class="input-group mb-3">
        <span class="input-group-text">
            <i class="fa fa-search"></i>
        </span>
        <input type="text" id="search" class="form-control" placeholder="Search item...">
    </div>

    <h5 class="text-center">
        Total Items: <span id="total" class="badge bg-primary">0</span>
        </h5>

        <ul id="list" class="list-group mt-3"></ul>

  </div>
</div>
<!-- ==========================================script============================================ -->

<script>
  let groceries = JSON.parse(localStorage.getItem("groceries")) || [];

  const form = document.getElementById("groceryForm");
  const list = document.getElementById("list");
  const total = document.getElementById("total");
  const searchInput = document.getElementById("search");

  function renderList(filterText = "") {
    list.innerHTML = "";

    let filtered = groceries.filter(item =>
      item.name.toLowerCase().includes(filterText.toLowerCase())
    );

    filtered.forEach(item => {
      const li = document.createElement("li");
        li.className = "list-group-item d-flex justify-content-between align-items-center";

        li.innerHTML = `
            <span>
            <i class="fa fa-shopping-basket text-success me-2"></i>
            ${item.name} (Qty: ${item.qty})
            </span>
        <div>
            <button class="btn btn-warning btn-sm me-2" onclick="updateItem(${item.id})">
                <i class="fa fa-edit"></i>
            </button>

            <button class="btn btn-danger btn-sm" onclick="deleteItem(${item.id})">
                <i class="fa fa-trash"></i>
            </button>
            </div>
      `;

      list.appendChild(li);

    });

    total.textContent = filtered.length;
    localStorage.setItem("groceries", JSON.stringify(groceries));
  }

  form.addEventListener("submit", function(e) {
        e.preventDefault();

        const name = document.getElementById("name").value.trim();
        const qty = document.getElementById("qty").value;

        const newItem = {
        id: Date.now(),
        name,
        qty
        };

        groceries.push(newItem);
        form.reset();
        renderList(searchInput.value);
    });

  function deleteItem(id) {
        groceries = groceries.filter(item => item.id !== id);
        renderList(searchInput.value);
    }

  function updateItem(id) {
        const newQty = prompt("Enter new quantity:");

        if (newQty !== null && newQty !== "") {
        groceries = groceries.map(item => {
            if (item.id === id) {
            return { ...item, qty: newQty };
            }
            return item;
        });
        renderList(searchInput.value);
        }
    }

//   =============================Search event==============================================
  searchInput.addEventListener("input", function() {
        renderList(this.value);
    });

    renderList();
</script>

</body>
</html>

<!DOCTYPE html>
<html>
<head>
<title>View Guests</title>

</head>
<body>
<div class="container mt-5">
    <h2 class="text-center">Guest List</h2>
    <input type="text" id="search" class="form-control mb-3" placeholder="Search by name">
    <table class="table table-bordered">
        <thead>
            <tr>
                <th>Name</th>
                <th>Phone</th>
                <th>Email</th>
                <th>Check In</th>
                <th>Adults</th>
            </tr>
        </thead>
        <tbody id="tableBody">

        </tbody>
    </table>

    <p id="nodata" class="text-center text-danger"></p>

</div>

<script src="view.js"></script>

</body>
</html>
